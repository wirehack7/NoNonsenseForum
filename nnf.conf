# Apache drop-in for the NoNonsense Forum Docker image.
#
# The application code sits at "/var/www/nnf" -- OUTSIDE the web-root -- so that "/var/www/html" (the DocumentRoot,
# and the mounted data volume) contains nothing but what NNF writes at runtime. "/_nnf" exposes the code to the
# rewrite rules in ".htaccess.docker"; "/themes" exposes the theme's own CSS / images to the browser.

Alias /_nnf   /var/www/nnf
Alias /themes /var/www/nnf/themes

<Directory /var/www/nnf>
	Require all granted
	AllowOverride None
	Options -MultiViews -Indexes +FollowSymLinks
</Directory>

DirectoryIndex /_nnf/index.php

# make sure the container environment reaches PHP's getenv () (see `FORUM_DATA` / `FORUM_PATH` in 'start.php')
PassEnv NNF_DATA_DIR NNF_URL_PATH

# NNF checks `$_SERVER['HTTP_HTACCESS']` to detect a working ".htaccess" and otherwise refuses to run (see the
# `HTACCESS` constant in 'start.php'). Its ".htaccess" sets this via a rewrite rule, but that rule does not re-run
# once a request is handed to the code at "/_nnf" (AllowOverride None), so set it here: in this image ".htaccess"
# is always present and always enabled.
SetEnv HTTP_HTACCESS 1

services:
  forum:
    build: .
    # to use the image already published by CI instead of building locally, comment out "build" above and
    # uncomment the line below (see '.github/workflows/docker-build.yml'):
    #image: ghcr.io/wirehack7/nononsenseforum:latest
    ports:
      - "8080:80"
    environment:
      # where NNF keeps everything it writes -- this is the web-root inside the container, and the mount below.
      # the application code lives separately at "/var/www/nnf" (baked into the image).
      NNF_DATA_DIR: /var/www/html
    volumes:
      # the data volume: sub-forums, threads ("*.rss"), "index.xml" / "sitemap.xml", "config.php", the "users"
      # folder, per-forum "about.html" / "mods.txt" &c. -- and nothing else. directly host-editable and backup-able.
      # "config.php" is seeded from "config.default.php" on first start; edit "./data/config.php" to customise.
      - ./data:/var/www/html
    restart: unless-stopped
